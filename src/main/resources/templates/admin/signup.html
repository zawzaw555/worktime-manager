<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSS -->
<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
<!-- JS -->
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}" defer></script>
<title>登録</title>
</head>
<body>
	<div class="login-wrapper">
		<div class="card bg-light rounded-4">
			<div class="card-body text-center">
				<form action="">
					<h2>登録</h2>
					<div class="input-control">
						<label>ログインID</label>
						<input type="text" placeholder="ログインID">
					</div>
					<div class="input-control">
						<label>名前</label>
						<input type="text" placeholder="名前">
					</div>
					<div class="input-control">
						<label>email</label>
						<input type="email" placeholder="ログインID">
					</div>
					<div class="input-control">
						<label>パスワード</label>
						<input type="password">
					</div>
					<input type="submit" value="登録" class="btn btn-primary mb-1"><br>
					<a href="">ログインへ</a>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
