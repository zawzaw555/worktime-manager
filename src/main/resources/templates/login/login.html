<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- CSS -->
<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/worker-style.css}">
<link rel="stylesheet" th:href="@{/css/admin-style.css}">
<!-- JS -->
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}" defer></script>
<title>ログイン</title>
</head>
<body>
	<div class="login-wrapper">
		<div class="card bg-light rounded-4">
			<div class="card-body text-center">
				<form th:action="@{/login}" method="post">
					<h2>ログイン</h2>
					<div class="input-group">
						<div class="input-label">
							<label for="userId">ログインID</label>
						</div>
						<div class="input-control">
							<input type="text" id="userId" name="userId" required>
						</div>
						<div class="input-label mt-3">
							<label for="password">パスワード</label>
						</div>
						<div class="input-control">
							<input type="password" id="password" name="password" required>
						</div>
						<p th:if="${errorMessage}"
							th:text="${errorMessage}"></p>
						<div class="mt-3 btn-bg">
							<input type="submit" value="ログイン" class="btn mb-1"><br>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>
</html>
