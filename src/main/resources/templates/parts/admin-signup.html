<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<title>Signup</title>
</head>
<body>
	<div th:fragment="signup-content">
		<div class="worker-frame">
			<div class="signup-wrapper">
				<div class="card bg-light rounded-4">
					<div class="card-body text-center">
						<form th:action="@{/admin/signup}" 
							  method="post"
							  th:object="${signupForm}">
							<h2>社員登録</h2>
							<div class="input-group">
								<div class="input-label">
									<label>ログインID</label>
								</div>
								<div class="input-control error-msg">
									<input type="text" th:field="*{workerNo}">
									<p th:errors="*{workerNo}"></p>
								</div>
								<div class="input-label">
									<label>社員名</label>
								</div>
								<div class="input-control error-msg">
									<input type="text" th:field="*{name}">
									<p th:errors="*{name}"></p>
								</div>
								<div class="input-label">
									<label>メールアドレス</label>
								</div>
								<div class="input-control error-msg">
									<input type="email" th:field="*{email}">
									<p th:errors="*{email}"></p>
								</div>
								<div class="input-label">
									<label>パスワード</label>
								</div>
								<div class="input-control error-msg">
									<input type="password" th:field="*{password}">
									<p th:errors="*{password}"></p>
								</div>
								<div class="wrapper-btn">
									<input type="submit" value="登録ボタン" class="mb-1"><br>
								</div>
								<a th:href="@{/admin/worker}">社員管理ページへ</a>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
