<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<title>Edit</title>
</head>
<body>
	<div th:fragment="detail-content">
		<div class="worker-frame">
			<div class="detail-wrapper">
				<div class="card bg-light rounded-4">
					<div class="card-body">
						<div th:object="${worker}">
							<h2>社員情報詳細</h2>
							<div class="detail-group">
								<div class="detail-label">
									<div class="one-label">
										<h5>ログインID  -</h5>
										<h5>社員名  -</h5>
										<h5>メールアドレス  -</h5>
									</div>
									<div>
										<h5 th:text="*{workerNo}"></h5>
										<h5 th:text="*{name}"></h5>
										<h5 th:text="*{email}"></h5>
									</div>
								</div>
								<a th:href="@{/admin/worker}">社員管理ページへ</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
