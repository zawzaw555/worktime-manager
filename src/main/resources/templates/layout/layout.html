<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	xmlns:layout="http://ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<meta name="viewpoit" content="width=device-width, initial-scale=1,shrink-to-fit=no">
<!-- 共通CSS -->
<link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
<link rel="stylesheet" th:href="@{/css/style.css}">
<!-- 共通JS -->
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}" defer></script>
<title>Layout</title>
</head>
<body>

	<!-- header -->
	<nav layout:replace="~{layout/header::header-content}"></nav>
	
	<!-- contents -->
	<div class="container">
		<div class="row text-center justify-content-center">
			<div class="col">
				<div layout:fragment="content"></div>
			</div>
		</div>
	</div>
</body>
</html>
